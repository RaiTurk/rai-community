[workspace]
members = ["crates/integrity", "crates/coordinator"]
resolver = "2"
[workspace.dependencies]
hdi = "=0.8.1"
hdk = "=0.7.1"
holochain_serialized_bytes = "=0.0.57"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"
rai_integrity = { path = "crates/integrity" }
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
